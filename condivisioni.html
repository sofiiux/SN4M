<!-- Indica che il documento utilizza HTML5. -->
<!DOCTYPE html>

<!-- Apre il documento HTML e imposta la lingua italiana. -->
<html lang="it">

<!-- Apre la sezione contenente le informazioni della pagina. -->
<head>

    <!-- Imposta la codifica dei caratteri UTF-8. -->
    <meta charset="UTF-8">

    <!-- Adatta la pagina alle dimensioni dello schermo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Imposta il titolo mostrato nella scheda del browser. -->
    <title>SN4M - Condivisioni</title>

    <!-- Collega il foglio di stile generale. -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Collega il foglio di stile del layout. -->
    <link rel="stylesheet" href="css/layout.css">

    <!-- Collega il foglio di stile della pagina Condivisioni. -->
    <link rel="stylesheet" href="css/condivisioni.css">

<!-- Chiude la sezione contenente le informazioni della pagina. -->
</head>

<!-- Apre il contenuto visibile della pagina. -->
<body>

    <!-- Apre la barra superiore dell'applicazione. -->
    <header class="main-header">

        <!-- Crea il collegamento del logo alla pagina di ricerca. -->
        <a href="ricerca.html" class="header-logo">

            <!-- Mostra il nome dell'applicazione. -->
            SN4M

        <!-- Chiude il collegamento del logo. -->
        </a>

        <!-- Apre il menu di navigazione principale. -->
        <nav class="header-menu">

            <!-- Crea il collegamento alla pagina Ricerca brani. -->
            <a href="ricerca.html">

                <!-- Mostra il nome della pagina Ricerca brani. -->
                Ricerca brani

            <!-- Chiude il collegamento alla pagina Ricerca brani. -->
            </a>

            <!-- Crea il collegamento alla pagina Playlist. -->
            <a href="playlist.html">

                <!-- Mostra il nome della pagina Playlist. -->
                Playlist

            <!-- Chiude il collegamento alla pagina Playlist. -->
            </a>

            <!-- Crea il collegamento alla pagina Comunità. -->
            <a href="comunita.html">

                <!-- Mostra il nome della pagina Comunità. -->
                Comunità

            <!-- Chiude il collegamento alla pagina Comunità. -->
            </a>

            <!-- Crea il collegamento alla pagina Condivisioni e lo indica come attivo. -->
            <a href="condivisioni.html" class="active">

                <!-- Mostra il nome della pagina Condivisioni. -->
                Condivisioni

            <!-- Chiude il collegamento alla pagina Condivisioni. -->
            </a>

        <!-- Chiude il menu di navigazione principale. -->
        </nav>

        <!-- Apre il contenitore del profilo nella barra superiore. -->
        <div class="header-profile">

            <!-- Apre il contenitore del menu del profilo. -->
            <div class="profile-menu">

                <!-- Crea il pulsante circolare che apre il menu del profilo. -->
                <button
                    type="button"
                    id="profile-menu-button"
                    class="profile-menu-button"
                >

                    <!-- Mostra temporaneamente la lettera U nel pulsante del profilo. -->
                    U

                <!-- Chiude il pulsante del profilo. -->
                </button>

                <!-- Apre la tendina contenente le informazioni del profilo. -->
                <div
                    id="profile-dropdown"
                    class="profile-dropdown"
                >

                    <!-- Mostra il nome dell'utente nella tendina. -->
                    <strong id="profile-menu-username">

                        <!-- Mostra temporaneamente la scritta Utente. -->
                        Utente

                    <!-- Chiude l'elemento del nome utente. -->
                    </strong>

                    <!-- Crea l'elemento in cui viene mostrata l'email dell'utente. -->
                    <p id="profile-menu-email"></p>

                    <!-- Crea il collegamento alla pagina del profilo. -->
                    <a
                        href="profilo.html"
                        class="profile-dropdown-link"
                    >

                        <!-- Mostra il testo del collegamento al profilo. -->
                        Modifica profilo

                    <!-- Chiude il collegamento alla pagina del profilo. -->
                    </a>

                    <!-- Crea il pulsante per effettuare il logout. -->
                    <button
                        type="button"
                        id="profile-logout-button"
                        class="profile-dropdown-logout"
                    >

                        <!-- Mostra il testo del pulsante Logout. -->
                        Logout

                    <!-- Chiude il pulsante Logout. -->
                    </button>

                <!-- Chiude la tendina del profilo. -->
                </div>

            <!-- Chiude il contenitore del menu del profilo. -->
            </div>

        <!-- Chiude il contenitore del profilo. -->
        </div>

    <!-- Chiude la barra superiore dell'applicazione. -->
    </header>

    <!-- Apre il contenitore generale del layout dell'applicazione. -->
    <div class="app-layout">

        <!-- Apre il contenuto principale della pagina Condivisioni. -->
        <main class="main-content">

            <!-- Apre l'intestazione della pagina. -->
            <header class="topbar">

                <!-- Apre il contenitore del titolo e della descrizione. -->
                <div>

                    <!-- Apre il titolo principale della pagina. -->
                    <h1>

                        <!-- Mostra il titolo della pagina. -->
                        Condivisioni

                    <!-- Chiude il titolo principale della pagina. -->
                    </h1>

                    <!-- Apre la descrizione della pagina. -->
                    <p class="page-description">

                        <!-- Spiega la funzione della pagina. -->
                        Condividi le tue playlist nelle comunità e scopri quelle degli altri utenti.

                    <!-- Chiude la descrizione della pagina. -->
                    </p>

                <!-- Chiude il contenitore del titolo e della descrizione. -->
                </div>

            <!-- Chiude l'intestazione della pagina. -->
            </header>

            <!-- Apre la sezione utilizzata per condividere una playlist. -->
            <section class="content-card share-form-card">

                <!-- Apre il titolo della sezione. -->
                <h2>

                    <!-- Mostra il titolo della sezione. -->
                    Condividi una playlist

                <!-- Chiude il titolo della sezione. -->
                </h2>

                <!-- Apre il form di condivisione. -->
                <form id="share-form">

                    <!-- Apre il gruppo utilizzato per scegliere una playlist. -->
                    <div class="form-group">

                        <!-- Crea l'etichetta del menu delle playlist. -->
                        <label for="share-playlist">

                            <!-- Mostra il nome del campo. -->
                            Playlist

                        <!-- Chiude l'etichetta del menu delle playlist. -->
                        </label>

                        <!-- Crea il menu a tendina contenente le playlist dell'utente. -->
                        <select
                            id="share-playlist"
                            required
                        ></select>

                    <!-- Chiude il gruppo della playlist. -->
                    </div>

                    <!-- Apre il gruppo utilizzato per scegliere una comunità. -->
                    <div class="form-group">

                        <!-- Crea l'etichetta del menu delle comunità. -->
                        <label for="share-community">

                            <!-- Mostra il nome del campo. -->
                            Comunità

                        <!-- Chiude l'etichetta del menu delle comunità. -->
                        </label>

                        <!-- Crea il menu a tendina contenente le comunità disponibili. -->
                        <select
                            id="share-community"
                            required
                        ></select>

                    <!-- Chiude il gruppo della comunità. -->
                    </div>

                    <!-- Crea il pulsante per condividere la playlist. -->
                    <button
                        type="submit"
                        class="page-button"
                    >

                        <!-- Mostra il testo del pulsante. -->
                        Condividi

                    <!-- Chiude il pulsante di condivisione. -->
                    </button>

                <!-- Chiude il form di condivisione. -->
                </form>

                <!-- Crea il paragrafo utilizzato per mostrare i messaggi della condivisione. -->
                <p
                    id="share-message"
                    class="page-description"
                ></p>

            <!-- Chiude la sezione di condivisione. -->
            </section>

            <!-- Apre la sezione contenente le playlist condivise. -->
            <section class="shared-section">

                <!-- Apre il form per cercare le playlist condivise. -->
                <form
                    id="shared-search-form"
                    class="shared-search-form shared-search-direct"
                >

                    <!-- Crea il campo utilizzato per cercare le playlist condivise. -->
                    <input
                        id="shared-search-input"
                        type="text"
                        placeholder="Cerca playlist condivise"
                    >

                    <!-- Crea il pulsante per avviare la ricerca. -->
                    <button
                        type="submit"
                        class="page-button"
                    >

                        <!-- Mostra il testo del pulsante di ricerca. -->
                        Cerca

                    <!-- Chiude il pulsante di ricerca. -->
                    </button>

                <!-- Chiude il form di ricerca. -->
                </form>

                <!-- Crea il contenitore in cui vengono mostrate le playlist condivise. -->
                <div
                    id="shared-playlist-list"
                    class="shared-grid"
                ></div>

            <!-- Chiude la sezione delle playlist condivise. -->
            </section>

        <!-- Chiude il contenuto principale della pagina. -->
        </main>

    <!-- Chiude il contenitore generale del layout. -->
    </div>

    <!-- Collega il file JavaScript contenente le funzioni comuni e la gestione dei dati. -->
    <script src="js/storage.js"></script>

    <!-- Collega il file JavaScript contenente la logica della pagina Condivisioni. -->
    <script src="js/condivisioni.js"></script>

<!-- Chiude il contenuto visibile della pagina. -->
</body>

<!-- Chiude il documento HTML. -->
</html>
